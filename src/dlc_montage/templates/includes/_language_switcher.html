{% load i18n %}
{% get_current_language as current_language %}
<form action="{% url 'set_language' %}" method="post" class="crm-language-switcher" aria-label="{% trans 'Sprache' %}">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  <button type="submit" name="language" value="ru" lang="ru" title="Русский"
          aria-label="Русский" aria-pressed="{% if current_language == 'ru' %}true{% else %}false{% endif %}">RU</button>
  <button type="submit" name="language" value="de" lang="de" title="Deutsch"
          aria-label="Deutsch" aria-pressed="{% if current_language == 'de' %}true{% else %}false{% endif %}">DE</button>
</form>
