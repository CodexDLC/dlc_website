[project]
name = "dlc_montage"
version = "0.1.0"
description = "My new project scaffolded with codex-django"
requires-python = ">=3.13,<3.14"
dependencies = [
    "django>=5.0",
    "python-dotenv",
    "dj-database-url",
    "psycopg2-binary",
    "loguru",
    "redis>=5.0",
    "codex-django",
    "codex-django-cli",
    "codex-core",
    "django-unfold",
    "django-prometheus",
    "django-allauth[socialaccount]",
    "gunicorn>=21.0",
    "openpyxl>=3.1.5",
    "django-storages[s3]>=1.14.6",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-django",
    "mypy",
    "django-stubs",
    "ruff",
    "bandit",
    "pre-commit",
    "pip-audit",
    "detect-secrets",
]

[project.scripts]
manage = "dlc_montage.manage:main"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
allowed-confusables = ["а", "с", "е", "о", "р", "х", "у", "А", "В", "Е", "К", "М", "Н", "О", "Р", "С", "Т", "У", "Х", "г"]
select = ["E", "F", "W", "I", "B", "S", "RUF"]
ignore = ["S101", "E402"]

[tool.ruff.lint.per-file-ignores]
"src/*/features/**/migrations/*.py" = ["RUF012"]

[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dlc_montage"]

[tool.pytest.ini_options]
django_debug_mode = true
DJANGO_SETTINGS_MODULE = "dlc_montage.core.settings.test"
pythonpath = ["src", "src/dlc_montage"]
testpaths = ["tests"]

[tool.codex-check]
project-name = "dlc_montage"
integration-requires = "PostgreSQL, Redis"
test-stages = ["unit", "integration"]
prompt-test-stages = ["integration"]
test-paths = ["tests"]
types-paths = ["src"]
run-extra-checks = true

[[tool.codex-check.extra-commands]]
name = "Docker Lint (Hadolint)"
command = ["hadolint", "deploy/dlc_montage/django.Dockerfile"]
skip-if-missing = "hadolint"
