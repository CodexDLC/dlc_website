# Layer 1: Infrastructure layer (PostgreSQL 18 + Redis 7)
# Canonical PostgreSQL 18 mount point: /var/lib/postgresql/data
# Password required from single source DLC_DB_PASSWORD in production/local composition
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DLC_DB_NAME:-dlc_montage}
      POSTGRES_USER: ${DLC_DB_USER:-dlc_montage}
      POSTGRES_PASSWORD: ${DLC_DB_PASSWORD:-dlc_local_pg_password}
    volumes:
      - dlc_pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-dlc_montage} -d $${POSTGRES_DB:-dlc_montage}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - dlc_network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - dlc_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s
    networks:
      - dlc_network
    restart: unless-stopped

volumes:
  dlc_pg_data:
  dlc_redis_data:

networks:
  dlc_network:
    driver: bridge
