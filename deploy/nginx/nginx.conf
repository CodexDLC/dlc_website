# DLC Montage — Nginx Reverse Proxy Configuration
# Handles static asset serving and strict private boundary protection

server {
    listen 80;
    server_name _;
    client_max_body_size 25M;

    # Static files collected by Django
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # Public media uploads (if any)
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Strict security boundary: NEVER serve private storage directly via Nginx
    location ^~ /data/private/ {
        deny all;
        return 404;
    }

    location ^~ /private/ {
        deny all;
        return 404;
    }

    # Health check passthrough (fast probe)
    location = /health/ {
        proxy_pass http://web:8000/health/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Forward all other requests to Gunicorn web runtime
    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
