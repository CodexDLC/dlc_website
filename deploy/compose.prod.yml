# DLC Montage — Production Container Environment
# Aggregates infra and django layers; hardened for production deployment.
#
# ==============================================================================
# Production Reverse Proxy Boundary:
# - Web service listens on internal container network (or loopback 127.0.0.1:8000).
# - An external host reverse proxy (Nginx, Caddy, Traefik, or Cloudflare Tunnel)
#   or the deploy/nginx container MUST handle:
#     1. Public TLS/HTTPS termination (Let's Encrypt / custom certificates)
#     2. Forwarding headers: Host, X-Real-IP, X-Forwarded-For, X-Forwarded-Proto
#     3. Gzip / Brotli compression
#     4. Rate limiting and DDoS protection at edge
#     5. Serving collected static files from dlc_static_data volume (/app/staticfiles)
#     6. Strictly blocking /data/private/ or /private/ paths from direct public access
# - No database or Redis ports are exposed on the host interface.
# ==============================================================================

include:
  - path:
      - compose.infra.yml
      - compose.django.yml
      - compose.prod.override.yml
